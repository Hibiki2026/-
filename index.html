
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>問題ランダム機構</title>
<style>
*{box-sizing:border-box}
:root{
 --bg:#f4f6ff;--card:#fff;--text:#25294a;--muted:#7c83a2;
 --primary:#6558e8;--primary2:#8878ff;--border:#e7e9f6;
 --pink:#ff72a5;--blue:#55b8ff;--green:#43c89b;
}
body{
 margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
 background:linear-gradient(135deg,#f4f5ff,#f9f1ff,#eefaff);
 color:var(--text);min-height:100vh;
}
header{
 padding:24px 16px 18px;text-align:center;
}
.logo{
 display:inline-flex;align-items:center;justify-content:center;
 width:58px;height:58px;border-radius:20px;
 background:linear-gradient(135deg,#7566f4,#a18cff);
 color:white;font-size:28px;box-shadow:0 8px 22px #8273ef44;
}
h1{font-size:26px;margin:10px 0 4px}
.subtitle{color:var(--muted);font-size:14px}
.container{max-width:950px;margin:auto;padding:0 15px 40px}
.tabs{display:flex;gap:9px;margin:12px 0 18px}
.tab{
 flex:1;border:none;padding:13px;border-radius:14px;
 background:#ffffffb8;color:#676d8e;font-weight:800;cursor:pointer;
}
.tab.active{background:var(--primary);color:white;box-shadow:0 5px 16px #6558e833}
.panel{display:none}
.panel.active{display:block}
.card{
 background:var(--card);border:1px solid var(--border);
 border-radius:20px;padding:20px;margin-bottom:15px;
 box-shadow:0 6px 24px #353d7110;
}
.card-title{font-weight:900;font-size:17px;margin-bottom:15px}
label{display:block;font-size:13px;font-weight:800;color:#626987;margin-bottom:7px}
input,textarea{
 width:100%;padding:13px;border-radius:13px;border:1px solid var(--border);
 background:#fafbff;color:var(--text);font:inherit;outline:none;
}
input:focus,textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px #6558e814}
textarea{resize:vertical;min-height:100px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field{margin-bottom:14px}
.buttons{display:flex;gap:9px;flex-wrap:wrap}
button{
 font:inherit;font-weight:800;cursor:pointer;border:none;
 transition:.15s transform,.15s opacity;
}
button:active{transform:scale(.97)}
.btn{padding:12px 16px;border-radius:13px}
.primary{background:linear-gradient(135deg,var(--primary),var(--primary2));color:white}
.secondary{background:#f0f1ff;color:#5f58c9}
.pink{background:#fff0f6;color:#d84e88}
.green{background:#e8fbf4;color:#15956e}
.gray{background:#f2f4f8;color:#65708b}
.danger{background:#fff0ee;color:#dc5e54}
.full{width:100%}
.question-box{
 min-height:210px;display:flex;flex-direction:column;justify-content:center;
 align-items:center;text-align:center;padding:25px 15px;
 background:linear-gradient(135deg,#f1efff,#f0faff);
 border:1px solid #e8e5ff;border-radius:20px;
}
.question-label{font-size:12px;color:#8179cf;font-weight:900;letter-spacing:2px}
.question-text{font-size:clamp(20px,4vw,30px);font-weight:900;white-space:pre-wrap;overflow-wrap:anywhere;margin:18px 0}
.answer-box{
 background:#eafff6;border:1px solid #d1f7e7;border-radius:15px;
 padding:17px;margin-top:12px;text-align:center;display:none;
}
.answer-title{font-size:12px;color:#249b76;font-weight:900}
.answer-text{font-size:20px;font-weight:900;white-space:pre-wrap;overflow-wrap:anywhere;margin-top:8px}
.quiz-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.stats{display:flex;gap:10px;margin-bottom:14px}
.stat{flex:1;background:#fff;border:1px solid var(--border);border-radius:15px;padding:13px;text-align:center}
.stat-num{font-size:22px;font-weight:900;color:var(--primary)}
.stat-label{font-size:12px;color:var(--muted)}
.list{display:flex;flex-direction:column;gap:9px}
.item{
 border:1px solid var(--border);border-radius:14px;padding:13px;
 display:flex;align-items:center;gap:10px;background:#fff;
}
.item-content{min-width:0;flex:1}
.item-q{font-weight:800;overflow-wrap:anywhere}
.item-a{font-size:13px;color:var(--muted);margin-top:5px;overflow-wrap:anywhere}
.item-actions{display:flex;gap:5px}
.small-btn{padding:8px 10px;border-radius:10px;font-size:12px}
.empty{text-align:center;color:var(--muted);padding:35px 10px}
#toast{
 position:fixed;bottom:22px;left:50%;transform:translateX(-50%);
 background:#25294a;color:white;padding:12px 18px;border-radius:14px;
 font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:99;
 max-width:90%;text-align:center;
}
#toast.show{opacity:1}
.code-area{font-family:monospace;font-size:12px;min-height:110px}
hr{border:0;border-top:1px solid var(--border);margin:20px 0}
@media(max-width:600px){
 h1{font-size:23px}
 .card{padding:15px}
 .form-grid{grid-template-columns:1fr;gap:0}
 .item{align-items:flex-start}
 .item-actions{flex-direction:column}
 .quiz-actions{grid-template-columns:1fr}
 .tabs{gap:6px}
 .tab{padding:11px 6px;font-size:13px}
}
</style>
</head>
<body>
<header>
 <div class="logo">🎲</div>
 <h1>問題ランダム機構</h1>
 <div class="subtitle">問題を登録して、ランダムに挑戦しよう！</div>
</header>

<div class="container">
 <div class="stats">
  <div class="stat"><div class="stat-num" id="totalCount">0</div><div class="stat-label">登録問題数</div></div>
  <div class="stat"><div class="stat-num" id="playCount">0</div><div class="stat-label">出題回数</div></div>
 </div>

 <div class="tabs">
  <button class="tab active" onclick="showTab('quiz',this)">🎲 出題</button>
  <button class="tab" onclick="showTab('manage',this)">📝 問題管理</button>
  <button class="tab" onclick="showTab('save',this)">💾 保存・引継ぎ</button>
 </div>

 <!-- 出題 -->
 <section class="panel active" id="quiz">
  <div class="card">
   <div class="question-box">
    <div class="question-label">RANDOM QUESTION</div>
    <div class="question-text" id="questionText">問題を登録するとここに表示されます</div>
   </div>
   <div class="answer-box" id="answerBox">
    <div class="answer-title">ANSWER</div>
    <div class="answer-text" id="answerText"></div>
   </div>
   <div class="quiz-actions">
    <button class="btn green" onclick="showAnswer()">👀 答えを見る</button>
    <button class="btn primary" onclick="nextQuestion()">🎲 次の問題</button>
   </div>
  </div>
  <div class="card">
   <div class="buttons">
    <button class="btn secondary full" onclick="showAnswer()">答えを表示 / 非表示</button>
   </div>
   <p style="font-size:13px;color:var(--muted);text-align:center;margin:12px 0 0">
    登録された問題からランダムに出題されます。直前と同じ問題はなるべく避けます。
   </p>
  </div>
 </section>

 <!-- 管理 -->
 <section class="panel" id="manage">
  <div class="card">
   <div class="card-title" id="formTitle">➕ 問題を追加</div>
   <div class="field">
    <label>問題文</label>
    <textarea id="questionInput" placeholder="問題文を入力"></textarea>
   </div>
   <div class="field">
    <label>答え</label>
    <textarea id="answerInput" placeholder="答えを入力"></textarea>
   </div>
   <div class="buttons">
    <button class="btn primary" onclick="saveQuestion()">追加する</button>
    <button class="btn gray" onclick="clearForm()">入力をクリア</button>
   </div>
  </div>
  <div class="card">
   <div class="card-title">📚 登録問題一覧</div>
   <div id="questionList" class="list"></div>
  </div>
 </section>

 <!-- 保存 -->
 <section class="panel" id="save">
  <div class="card">
   <div class="card-title">📦 引き継ぎコード</div>
   <p style="font-size:13px;color:var(--muted)">登録した問題をコードにして保存できます。他の端末に移したり、バックアップしたりできます。</p>
   <button class="btn primary full" onclick="exportData()">引き継ぎコードを作る</button>
   <div class="field" style="margin-top:12px">
    <textarea id="exportCode" class="code-area" placeholder="作成したコードがここに表示されます"></textarea>
   </div>
   <button class="btn secondary full" onclick="copyCode()">📋 コードをコピー</button>
   <hr>
   <div class="card-title">📥 引き継ぎコードを読み込む</div>
   <textarea id="importCode" class="code-area" placeholder="ここに引き継ぎコードを貼り付け"></textarea>
   <div class="buttons" style="margin-top:10px">
    <button class="btn green full" onclick="importData()">読み込む（追加）</button>
    <button class="btn danger full" onclick="replaceData()">全部置き換える</button>
   </div>
  </div>
  <div class="card">
   <div class="card-title">⚠️ データについて</div>
   <p style="font-size:13px;color:var(--muted)">
    データはこのブラウザ内に保存されます。ブラウザのデータ消去や別端末では消える場合があるため、引き継ぎコードをバックアップしてください。
   </p>
   <button class="btn danger full" onclick="clearAll()">全問題を削除</button>
  </div>
 </section>
</div>

<div id="toast"></div>

<script>
const STORAGE_KEY="random_question_mechanism_v1";
let questions=[];
let lastQuestionId=null;
let currentQuestion=null;
let editingId=null;
let playCount=0;

function loadData(){
 try{
  const saved=JSON.parse(localStorage.getItem(STORAGE_KEY)||"{}");
  questions=Array.isArray(saved.questions)?saved.questions:[];
  playCount=Number(saved.playCount)||0;
 }catch(e){questions=[];playCount=0}
 updateStats();
 renderList();
}

function saveData(){
 localStorage.setItem(STORAGE_KEY,JSON.stringify({questions,playCount}));
 updateStats();
 renderList();
}

function updateStats(){
 document.getElementById("totalCount").textContent=questions.length;
 document.getElementById("playCount").textContent=playCount;
}

function showTab(id,btn){
 document.querySelectorAll(".panel").forEach(p=>p.classList.remove("active"));
 document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
 document.getElementById(id).classList.add("active");
 btn.classList.add("active");
 if(id==="manage")renderList();
}

function toast(message){
 const el=document.getElementById("toast");
 el.textContent=message;el.classList.add("show");
 clearTimeout(window.toastTimer);
 window.toastTimer=setTimeout(()=>el.classList.remove("show"),2200);
}

function saveQuestion(){
 const q=document.getElementById("questionInput").value.trim();
 const a=document.getElementById("answerInput").value.trim();
 if(!q||!a){toast("問題文と答えを両方入力してね");return}
 if(editingId){
  const item=questions.find(x=>x.id===editingId);
  if(item){item.question=q;item.answer=a}
  toast("問題を更新しました");
 }else{
  questions.push({id:Date.now().toString()+Math.random().toString(16).slice(2),question:q,answer:a});
  toast("問題を追加しました！");
 }
 clearForm();saveData();
}

function clearForm(){
 document.getElementById("questionInput").value="";
 document.getElementById("answerInput").value="";
 editingId=null;
 document.getElementById("formTitle").textContent="➕ 問題を追加";
}

function editQuestion(id){
 const item=questions.find(x=>x.id===id);
 if(!item)return;
 editingId=id;
 document.getElementById("questionInput").value=item.question;
 document.getElementById("answerInput").value=item.answer;
 document.getElementById("formTitle").textContent="✏️ 問題を編集";
 window.scrollTo({top:0,behavior:"smooth"});
}

function deleteQuestion(id){
 if(!confirm("この問題を削除しますか？"))return;
 questions=questions.filter(x=>x.id!==id);
 if(editingId===id)clearForm();
 saveData();toast("削除しました");
}

function renderList(){
 const box=document.getElementById("questionList");
 if(!questions.length){
  box.innerHTML='<div class="empty">まだ問題がありません。上から追加してね！</div>';
  return;
 }
 box.innerHTML=questions.map((item,index)=>`
  <div class="item">
   <div class="item-content">
    <div class="item-q">${index+1}. ${escapeHtml(item.question)}</div>
    <div class="item-a">答え：${escapeHtml(item.answer)}</div>
   </div>
   <div class="item-actions">
    <button class="small-btn secondary" onclick="editQuestion('${item.id}')">編集</button>
    <button class="small-btn danger" onclick="deleteQuestion('${item.id}')">削除</button>
   </div>
  </div>`).join("");
}

function escapeHtml(str){
 return String(str).replace(/[&<>"']/g,m=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
 }[m]));
}

function nextQuestion(){
 if(!questions.length){
  document.getElementById("questionText").textContent="まず問題を登録してね！";
  document.getElementById("answerBox").style.display="none";
  return;
 }
 let pool=questions;
 if(questions.length>1&&lastQuestionId){
  pool=questions.filter(q=>q.id!==lastQuestionId);
 }
 const selected=pool[Math.floor(Math.random()*pool.length)];
 currentQuestion=selected;
 lastQuestionId=selected.id;
 document.getElementById("questionText").textContent=selected.question;
 document.getElementById("answerText").textContent=selected.answer;
 document.getElementById("answerBox").style.display="none";
 playCount++;
 saveData();
}

function showAnswer(){
 if(!currentQuestion){
  if(questions.length){nextQuestion()}
  else{toast("先に問題を登録してね");return}
 }
 const box=document.getElementById("answerBox");
 box.style.display=box.style.display==="block"?"none":"block";
}

function exportData(){
 const payload={version:1,questions,playCount};
 const code=btoa(unescape(encodeURIComponent(JSON.stringify(payload))));
 document.getElementById("exportCode").value="QRM1-"+code;
 toast("引き継ぎコードを作りました");
}

async function copyCode(){
 const code=document.getElementById("exportCode").value;
 if(!code){toast("先にコードを作ってね");return}
 try{
  await navigator.clipboard.writeText(code);
  toast("コピーしました！");
 }catch(e){
  document.getElementById("exportCode").select();
  document.execCommand("copy");
  toast("コピーしました！");
 }
}

function decodeCode(raw){
 const code=raw.trim().replace(/\s/g,"");
 if(!code.startsWith("QRM1-"))throw new Error("コードの形式が違います");
 const data=JSON.parse(decodeURIComponent(escape(atob(code.slice(5)))));
 if(!Array.isArray(data.questions))throw new Error("問題データがありません");
 return data;
}

function importData(){
 try{
  const data=decodeCode(document.getElementById("importCode").value);
  let added=0;
  data.questions.forEach(item=>{
   if(item.question&&item.answer){
    questions.push({id:Date.now().toString()+Math.random().toString(16).slice(2),question:item.question,answer:item.answer});
    added++;
   }
  });
  saveData();
  toast(added+"問を追加しました");
  document.getElementById("importCode").value="";
 }catch(e){toast("コードを確認してください")}
}

function replaceData(){
 if(!confirm("現在の問題をすべて消して、コードの内容に置き換えますか？"))return;
 try{
  const data=decodeCode(document.getElementById("importCode").value);
  questions=data.questions.map(item=>({
   id:Date.now().toString()+Math.random().toString(16).slice(2),
   question:item.question,answer:item.answer
  }));
  playCount=Number(data.playCount)||0;
  currentQuestion=null;lastQuestionId=null;
  saveData();toast("データを置き換えました");
  document.getElementById("importCode").value="";
 }catch(e){toast("コードを確認してください")}
}

function clearAll(){
 if(!confirm("本当に全問題を削除しますか？この操作は戻せません。"))return;
 questions=[];currentQuestion=null;lastQuestionId=null;playCount=0;
 saveData();clearForm();
 document.getElementById("questionText").textContent="問題を登録するとここに表示されます";
 document.getElementById("answerBox").style.display="none";
 toast("全問題を削除しました");
}

loadData();
</script>
</body>
</html>
