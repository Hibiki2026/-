<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>問題ランダム機構</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,sans-serif;background:#f2f5ff;color:#20243a}
button{border:0;border-radius:12px;padding:12px 16px;font-size:16px;font-weight:bold;cursor:pointer;background:#6375ff;color:white}
button:active{transform:scale(.97)}
.secondary{background:#e5e9ff;color:#3543a9}
.danger{background:#ff647c}
input,textarea{width:100%;padding:12px;border:2px solid #dce1ff;border-radius:12px;font-size:16px;background:white;color:#222}
textarea{resize:vertical;min-height:75px}
header{background:linear-gradient(120deg,#6677ff,#a16bff);color:white;padding:18px;display:flex;justify-content:space-between;align-items:center;gap:10px}
header h1{margin:0;font-size:21px}
.layout{display:flex;min-height:calc(100vh - 70px)}
.sidebar{width:250px;background:white;padding:15px;border-right:1px solid #ddd;flex-shrink:0}
.main{padding:20px;width:100%;max-width:1000px;margin:auto}
.panel{background:white;border-radius:18px;padding:18px;margin-bottom:18px;box-shadow:0 4px 15px #dfe3f5}
.setitem{padding:12px;margin:8px 0;background:#f1f3ff;border-radius:12px;cursor:pointer;overflow-wrap:anywhere}
.setitem.active{background:#dfe4ff;border:2px solid #7785ff}
.setitem small{display:block;color:#667;margin-top:4px}
#quiz{text-align:center;padding:24px 15px}
#progress{font-size:22px;font-weight:bold;color:#6574ff}
#round{color:#667;margin:8px}
#question{font-size:clamp(23px,4vw,36px);font-weight:bold;white-space:pre-wrap;overflow-wrap:anywhere;min-height:90px;display:flex;align-items:center;justify-content:center}
#answer{font-size:clamp(19px,3vw,27px);white-space:pre-wrap;background:#f3f4ff;border-radius:15px;padding:18px;margin-top:15px;display:none}
.quizbuttons{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.checked{background:#35ae79!important}
.guaranteed{background:#ffb52f!important;color:#452e00!important}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1;min-width:100px}
.questionitem{background:#f4f5ff;padding:12px;border-radius:12px;margin:10px 0}
.questionitem .qtitle{font-weight:bold;margin-bottom:5px}
.hidden{display:none!important}
#mobileMenu{display:none}
.muted{color:#778;font-size:14px}
hr{border:0;border-top:1px solid #e5e8f5;margin:18px 0}
.savebar{position:sticky;top:8px;z-index:5;background:white;padding:10px;border-radius:12px;box-shadow:0 3px 12px #dfe3f5;margin-bottom:12px}
.itembuttons{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.itembuttons button{font-size:14px;padding:8px 12px}
#comment{margin:16px 0;padding:16px;border-radius:16px;background:linear-gradient(120deg,#fff1c8,#ffe4e9);font-size:18px;font-weight:bold;color:#754900;min-height:30px;white-space:pre-wrap}
@media(max-width:700px){
 .layout{display:block}
 .sidebar{width:100%;border:0}
 #mobileMenu{display:inline-block}
 .main{padding:12px}
 header h1{font-size:18px}
}
</style>
</head>
<body>

<header>
<h1>🎲 問題ランダム機構</h1>
<button id="mobileMenu" class="secondary" onclick="toggleSidebar()">セット一覧</button>
</header>

<div class="layout">
<aside class="sidebar" id="sidebar">
<h3>📚 保存済みセット</h3>
<div id="setlist"></div>
<hr>
<button onclick="newSet()" style="width:100%">＋ 新しいセットを作る</button>
<button class="secondary" onclick="showManage()" style="width:100%;margin-top:8px">セット管理</button>
</aside>

<main class="main">

<section class="panel" id="quiz">
<div id="progress">0 / 0</div>
<div id="round">周回 0</div>
<div id="question">セットを選んでください</div>
<div id="answer"></div>
<div id="comment"></div>

<div class="quizbuttons">
<button id="nextBtn" onclick="nextQuestion()">始める</button>
<button id="modeBtn" class="secondary" onclick="toggleQuestionMode()">出題順：ランダム</button>
<button id="prevBtn" class="secondary" onclick="previousQuestion()" disabled>← 前の問題</button>
<button id="answerBtn" class="secondary" onclick="toggleAnswer()">答えを見る</button>
<button id="checkBtn" class="secondary" onclick="toggleCheck()">☐ チェック</button>
<button id="mustBtn" class="secondary" onclick="toggleMust()">☆ 必ず出る</button>
<button class="secondary" onclick="resetSet()">元通りにする</button>
<button class="secondary" onclick="showChecked()">チェック一覧</button>
</div>
<p class="muted">Enter：開始・答え表示・次の問題 ／ →：次の問題</p>
</section>

<section class="panel hidden" id="checkedPanel">
<h2>☑ チェックした問題</h2>
<div id="checkedList"></div>
<button class="secondary" onclick="hideChecked()">閉じる</button>
</section>

<section class="panel hidden" id="editor">
<h2 id="editorTitle">問題セット作成</h2>
<input id="setName" placeholder="セットの名前">

<div class="savebar">
<button id="topSaveBtn" onclick="saveSet()" style="width:100%">保存</button>
</div>

<hr>
<div class="row">
<div>
<label>問題</label>
<textarea id="questionInput" placeholder="問題を入力"></textarea>
</div>
<div>
<label>答え</label>
<textarea id="answerInput" placeholder="答えを入力"></textarea>
</div>
</div>

<button onclick="addQuestion()" style="width:100%;margin-top:10px">＋ 問題を追加</button>
<p class="muted">問題欄で Enter → 答え欄へ移動。答え欄で Enter → 問題追加。Shift+Enter で改行。</p>

<div id="draftList"></div>

<div class="savebar">
<button id="bottomSaveBtn" onclick="saveSet()" style="width:100%">保存</button>
</div>

<button class="secondary" onclick="cancelEdit()" style="width:100%">キャンセル</button>
</section>

<section class="panel hidden" id="manage">
<h2>セット管理</h2>
<div id="manageList"></div>
<button class="secondary" onclick="hideManage()">閉じる</button>
</section>

<section class="panel" id="sharePanel">
<h3>🔗 セットを共有（RenderのURLで共有）</h3>
<p class="muted">共有したいセットを選び、リンクを作成してください。リンクを開くと選んだセットが追加されます。既存セットは消えません。</p>
<div id="shareSetList"></div>
<div class="row" style="margin-top:8px">
<button class="secondary" onclick="selectAllShareSets(true)">全セット選択</button>
<button class="secondary" onclick="selectAllShareSets(false)">選択解除</button>
</div>
<button onclick="createShareLink()" style="width:100%;margin-top:10px">共有リンクを作る</button>
<textarea id="shareLink" placeholder="ここに共有リンクが表示されます" readonly style="margin-top:10px;min-height:90px"></textarea>
<button class="secondary" onclick="copyShareLink()" style="width:100%;margin-top:8px">共有リンクをコピー</button>
</section>

<section class="panel">
<h3>🔄 引き継ぎ</h3>
<textarea id="transfer" placeholder="引き継ぎコード"></textarea>
<div class="row" style="margin-top:8px">
<button onclick="exportCode()">コードを作る</button>
<button class="secondary" onclick="copyCode()">コピー</button>
<button class="secondary" onclick="importCode()">読み込み</button>
</div>
<p class="muted">読み込みはセットを追加します。</p>
</section>

</main>
</div>

<script>
const STORAGE_KEY="question_random_mechanism_v3";
const BACKUP_KEY="question_random_mechanism_v3_backup";

let data;
let currentSetId=null;
let currentQuestion=null;
let answerShown=false;
let draft=[];
let editingId=null;
let isEditing=false;
let currentBag=[];
let questionMode="random";
let questionHistory=[];
let historyIndex=-1;
let currentRound=0;
let reviewMode=false;
let lastComment="";

function loadData(){
 const raw=localStorage.getItem(STORAGE_KEY);
 if(!raw){
  data={questions:[],sets:[],activeSetId:null,bag:[],rounds:0};
  return;
 }
 try{
  data=JSON.parse(raw);
  if(!data||typeof data!=="object")throw new Error();
  if(!Array.isArray(data.questions))data.questions=[];
  if(!Array.isArray(data.sets))data.sets=[];
  if(!Array.isArray(data.bag))data.bag=[];
  if(typeof data.rounds!=="number")data.rounds=0;

  data.sets.forEach(s=>{
   if(!Array.isArray(s.checkedIds))s.checkedIds=[];
   if(!Array.isArray(s.mustIds))s.mustIds=[];
  });
 }catch(e){
  alert("保存データが読み込めませんでした。元データは消さずに残しています。");
  data={questions:[],sets:[],activeSetId:null,bag:[],rounds:0};
 }
}

function saveData(){
 try{
  const old=localStorage.getItem(STORAGE_KEY);
  if(old&&!localStorage.getItem(BACKUP_KEY)){
   localStorage.setItem(BACKUP_KEY,old);
  }
  localStorage.setItem(STORAGE_KEY,JSON.stringify(data));
 }catch(e){
  alert("保存できませんでした。ブラウザの保存容量を確認してください。");
 }
}

function uid(){
 return Date.now().toString(36)+Math.random().toString(36).slice(2,8);
}

function getSet(id){
 return data.sets.find(s=>String(s.id)===String(id));
}

function setQuestions(s){
 if(!s)return [];
 if(Array.isArray(s.questionIds)){
  return s.questionIds.map(id=>data.questions.find(q=>String(q.id)===String(id))).filter(Boolean);
 }
 if(Array.isArray(s.questions)){
  return s.questions.map(q=>{
   if(typeof q==="string")return data.questions.find(x=>String(x.id)===q);
   if(q&&q.id&&data.questions.find(x=>String(x.id)===String(q.id)))
    return data.questions.find(x=>String(x.id)===String(q.id));
   return q;
  }).filter(Boolean);
 }
 if(Array.isArray(s.items))return s.items;
 return [];
}

function getQ(q){
 if(!q)return {id:uid(),q:"",a:""};
 if(typeof q==="string")return {id:uid(),q:q,a:""};
 return {
  id:q.id||uid(),
  q:q.q??q.question??q.text??"",
  a:q.a??q.answer??q.ans??""
 };
}

function render(){
 renderSets();
 renderQuiz();
 renderShareSets();
}

function renderSets(){
 const list=document.getElementById("setlist");
 list.innerHTML="";
 data.sets.forEach(s=>{
  const el=document.createElement("div");
  el.className="setitem"+(String(s.id)===String(currentSetId)?" active":"");
  const name=document.createElement("strong");
  name.textContent=s.name||"名前なし";
  const small=document.createElement("small");
  small.textContent=setQuestions(s).length+" 問";
  el.append(name,small);
  el.onclick=()=>selectSet(s.id);
  list.appendChild(el);
 });
 if(!data.sets.length)list.innerHTML="<p class='muted'>まだセットがありません</p>";
}

function selectSet(id){
 currentSetId=id;
 data.activeSetId=id;
 currentQuestion=null;
 answerShown=false;
 currentBag=[];
 questionHistory=[];
 historyIndex=-1;
 currentRound=0;
 reviewMode=false;
 lastComment="";
 saveData();
 render();
 hideManage();
 hideChecked();
}

function renderQuiz(){
 const s=getSet(currentSetId);
 const qs=setQuestions(s);
 const total=qs.length;
 const progress=currentQuestion&&total?(questionMode==="ordered"?historyIndex+1:questionHistory.length):0;

 document.getElementById("progress").textContent=reviewMode
  ?"チェック問題"
  :`${progress} / ${total}`;
 document.getElementById("round").textContent=`周回 ${currentRound}`;
 document.getElementById("question").textContent=currentQuestion
  ?currentQuestion.q
  :(s?"準備完了":"セットを選んでください");

 const ans=document.getElementById("answer");
 ans.style.display=answerShown?"block":"none";
 ans.textContent=currentQuestion?currentQuestion.a:"";

 document.getElementById("comment").textContent=lastComment;

 document.getElementById("nextBtn").textContent=currentQuestion?"次の問題":"始める";
 document.getElementById("modeBtn").textContent="出題順："+(questionMode==="random"?"ランダム":"順番どおり");
 document.getElementById("prevBtn").disabled=historyIndex<=0;
 document.getElementById("answerBtn").style.display=currentQuestion?"inline-block":"none";
 document.getElementById("answerBtn").textContent=answerShown?"答えを隠す":"答えを見る";

 const checked=s&&currentQuestion&&Array.isArray(s.checkedIds)&&s.checkedIds.includes(String(currentQuestion.id));
 const must=s&&currentQuestion&&Array.isArray(s.mustIds)&&s.mustIds.includes(String(currentQuestion.id));

 document.getElementById("checkBtn").style.display=currentQuestion?"inline-block":"none";
 document.getElementById("checkBtn").textContent=checked?"☑ チェック済み":"☐ チェック";
 document.getElementById("checkBtn").className="secondary"+(checked?" checked":"");

 document.getElementById("mustBtn").style.display=currentQuestion?"inline-block":"none";
 document.getElementById("mustBtn").textContent=must?"★ 必ず出る設定中":"☆ 必ず出る";
 document.getElementById("mustBtn").className="secondary"+(must?" guaranteed":"");
}

const comments={
 1:[
  "いいスタート！まずは全体を覚えていこう🔥",
  "第1周スタート！焦らず一問ずついこう！",
  "始めたことがもう一歩前進！さあいこう！"
 ],
 2:[
  "2周目突入！さっきより思い出せるかな？",
  "もう一周！繰り返すほど記憶に残るよ💪",
  "いい調子！少しずつ慣れてきたね！"
 ],
 3:[
  "3周目！積み重ねが力になってる！",
  "ここまで続けてえらい！もう一周いこう！",
  "繰り返しの力は強い！その調子！"
 ],
 5:[
  "5周達成！かなり頑張ってる！🏆",
  "5周目！努力が積み重なってるね！",
  "すごい集中力！まだまだいける！"
 ],
 10:[
  "10周達成！！素晴らしい粘り強さ！🎉",
  "10周も続けた！大きな成果だね！",
  "10周目！ここまでやり抜いたのはすごい！"
 ],
 20:[
  "20周達成！本当にコツコツ頑張ってる！🌟",
  "20周！積み重ねの達人だ！",
  "ここまで来た！自分の努力を認めよう！"
 ],
 50:[
  "50周達成！！記録級の頑張り！🏅",
  "50周！すごい継続力！",
  "50周達成！努力が光ってる！"
 ],
 other:[
  "新しい周回！ここからまた一歩！",
  "続けることが力になる！いこう！",
  "いいね！次の周回も落ち着いて！",
  "少しずつ積み重ねていこう！",
  "今日の努力はちゃんと前進！",
  "集中して一問ずつ！応援してる！",
  "また一周！記憶を強くしていこう！",
  "いいペース！その調子で続けよう！",
  "問題を繰り返すたびに成長してる！",
  "次の周回もチャレンジ！🔥"
 ]
};

function getRoundComment(round){
 let pool=comments[round]||comments.other;
 let chosen;
 do{
  chosen=pool[Math.floor(Math.random()*pool.length)];
 }while(pool.length>1&&chosen===lastComment);
 lastComment=chosen;
 return `🎉 ${round}周目！ ${chosen}`;
}

function shuffle(arr){
 for(let i=arr.length-1;i>0;i--){
  const j=Math.floor(Math.random()*(i+1));
  [arr[i],arr[j]]=[arr[j],arr[i]];
 }
 return arr;
}

function toggleQuestionMode(){
 questionMode=questionMode==="random"?"ordered":"random";
 currentQuestion=null;answerShown=false;currentBag=[];questionHistory=[];historyIndex=-1;currentRound=0;reviewMode=false;lastComment="";
 renderQuiz();
}

function showHistoryQuestion(index){
 const s=getSet(currentSetId);if(!s)return;
 const qs=setQuestions(s);const id=questionHistory[index];
 currentQuestion=qs.find(q=>String(q.id)===String(id))||null;
 historyIndex=index;answerShown=false;reviewMode=false;renderQuiz();
}

function previousQuestion(){
 if(isEditing||historyIndex<=0)return;
 showHistoryQuestion(historyIndex-1);
}

function nextQuestion(){
 if(isEditing)return;
 const s=getSet(currentSetId);
 if(!s){alert("先に保存済みセットを選んでください");return}
 const qs=setQuestions(s);
 if(!qs.length){alert("このセットには問題がありません");return}
 reviewMode=false;
 // 一度戻ったあとなら、既に表示した履歴を先へ進む
 if(historyIndex<questionHistory.length-1){showHistoryQuestion(historyIndex+1);return;}
 if(!currentBag.length){
  currentBag=qs.map(q=>String(q.id));
  if(questionMode==="random")shuffle(currentBag);
  currentRound++;
  lastComment=getRoundComment(currentRound);
  questionHistory=[];historyIndex=-1;
 }
 let id;
 if(questionMode==="ordered"){
  id=currentBag.shift();
 }else{
  const mustIds=Array.isArray(s.mustIds)?s.mustIds.map(String):[];
  const mustIndex=currentBag.findIndex(x=>mustIds.includes(String(x)));
  id=mustIndex!==-1?currentBag.splice(mustIndex,1)[0]:currentBag.pop();
 }
 questionHistory.push(String(id));
 historyIndex=questionHistory.length-1;
 currentQuestion=qs.find(q=>String(q.id)===String(id))||qs[0];
 answerShown=false;
 renderQuiz();
}

function toggleAnswer(){
 if(!currentQuestion)return;
 answerShown=!answerShown;
 renderQuiz();
}

function toggleCheck(){
 if(!currentQuestion)return;
 const s=getSet(currentSetId);
 if(!s)return;
 if(!Array.isArray(s.checkedIds))s.checkedIds=[];
 const id=String(currentQuestion.id);
 if(s.checkedIds.includes(id)){
  s.checkedIds=s.checkedIds.filter(x=>String(x)!==id);
 }else{
  s.checkedIds.push(id);
 }
 saveData();
 renderQuiz();
}

function toggleMust(){
 if(!currentQuestion)return;
 const s=getSet(currentSetId);
 if(!s)return;
 if(!Array.isArray(s.mustIds))s.mustIds=[];
 const id=String(currentQuestion.id);
 if(s.mustIds.includes(id)){
  s.mustIds=s.mustIds.filter(x=>String(x)!==id);
 }else{
  s.mustIds.push(id);
 }
 saveData();
 renderQuiz();
}

function showChecked(){
 const s=getSet(currentSetId);
 if(!s){alert("先にセットを選んでください");return}
 const checkedIds=Array.isArray(s.checkedIds)?s.checkedIds:[];
 const qs=setQuestions(s).filter(q=>checkedIds.includes(String(q.id)));
 const el=document.getElementById("checkedList");
 el.innerHTML="";

 if(!qs.length){
  el.innerHTML="<p>チェックした問題はありません。</p>";
 }else{
  qs.forEach((q,i)=>{
   const box=document.createElement("div");
   box.className="questionitem";
   const title=document.createElement("strong");
   title.textContent=(i+1)+". "+q.q;
   const ans=document.createElement("div");
   ans.textContent="答え："+q.a;
   const btn=document.createElement("button");
   btn.textContent="この問題を表示";
   btn.onclick=()=>{
    currentQuestion=q;
    answerShown=false;
    reviewMode=true;
    renderQuiz();
    document.getElementById("quiz").scrollIntoView({behavior:"smooth"});
    hideChecked();
   };
   box.append(title,ans,btn);
   el.appendChild(box);
  });
 }
 document.getElementById("checkedPanel").classList.remove("hidden");
}

function hideChecked(){
 document.getElementById("checkedPanel").classList.add("hidden");
}

function resetSet(){
 if(!currentSetId)return;
 currentQuestion=null;
 answerShown=false;
 currentBag=[];
 questionHistory=[];
 historyIndex=-1;
 currentRound=0;
 reviewMode=false;
 lastComment="";
 renderQuiz();
}

function toggleSidebar(){
 document.getElementById("sidebar").classList.toggle("hidden");
}

function newSet(){
 if(isEditing)return;
 editingId=null;
 draft=[];
 isEditing=true;
 document.getElementById("editorTitle").textContent="新しい問題セット";
 document.getElementById("setName").value="";
 updateSaveButtons();
 document.getElementById("editor").classList.remove("hidden");
 document.getElementById("manage").classList.add("hidden");
 renderDraft();
 document.getElementById("questionInput").focus();
}

function editSet(id){
 const pw=prompt("編集パスワードを入力してください");
 if(pw!=="Hibiki"){
  if(pw!==null)alert("パスワードが違います");
  return;
 }
 const s=getSet(id);
 if(!s)return;

 editingId=id;
 draft=setQuestions(s).map(q=>getQ(q));
 isEditing=true;
 document.getElementById("editorTitle").textContent="セット編集";
 document.getElementById("setName").value=s.name;
 updateSaveButtons();
 document.getElementById("editor").classList.remove("hidden");
 document.getElementById("manage").classList.add("hidden");
 renderDraft();
}

function updateSaveButtons(){
 const label=editingId?"更新":"保存";
 document.getElementById("topSaveBtn").textContent=label;
 document.getElementById("bottomSaveBtn").textContent=label;
}

function renderDraft(){
 const el=document.getElementById("draftList");
 el.innerHTML="<h3>問題一覧 ("+draft.length+")</h3>";

 draft.forEach((q,i)=>{
  const box=document.createElement("div");
  box.className="questionitem";

  const qt=document.createElement("div");
  qt.className="qtitle";
  qt.textContent=(i+1)+". "+q.q;

  const at=document.createElement("div");
  at.textContent="答え："+q.a;

  const buttons=document.createElement("div");
  buttons.className="itembuttons";

  const edit=document.createElement("button");
  edit.className="secondary";
  edit.textContent="編集";
  edit.onclick=()=>{
   const newQ=prompt("問題文を編集",q.q);
   if(newQ===null)return;
   const newA=prompt("答えを編集",q.a);
   if(newA===null)return;
   if(!newQ.trim()||!newA.trim()){
    alert("問題と答えを空にはできません");
    return;
   }
   q.q=newQ;
   q.a=newA;
   renderDraft();
  };

  const del=document.createElement("button");
  del.className="danger";
  del.textContent="削除";
  del.onclick=()=>{
   if(!confirm("この問題を削除しますか？"))return;
   draft.splice(i,1);
   renderDraft();
  };

  buttons.append(edit,del);
  box.append(qt,at,buttons);
  el.appendChild(box);
 });
}

function addQuestion(){
 const q=document.getElementById("questionInput").value.trim();
 const a=document.getElementById("answerInput").value.trim();
 if(!q||!a){alert("問題と答えの両方を入力してください");return}
 draft.push({id:uid(),q,a});
 document.getElementById("questionInput").value="";
 document.getElementById("answerInput").value="";
 renderDraft();
 document.getElementById("questionInput").focus();
}

function saveSet(){
 const name=document.getElementById("setName").value.trim();
 if(!name){alert("セット名を入力してください");return}
 if(!draft.length){alert("問題を1つ以上追加してください");return}

 const wasUpdating=!!editingId;
 let s;

 if(editingId){
  s=getSet(editingId);
  if(!s)return;
 }else{
  s={id:uid(),name,questionIds:[],checkedIds:[],mustIds:[]};
  data.sets.push(s);
 }

 s.name=name;
 if(!Array.isArray(s.checkedIds))s.checkedIds=[];
 if(!Array.isArray(s.mustIds))s.mustIds=[];

 const newQs=draft.map(q=>({id:q.id||uid(),q:q.q,a:q.a}));

 newQs.forEach(q=>{
  const existing=data.questions.find(x=>String(x.id)===String(q.id));
  if(existing){
   existing.q=q.q;
   existing.a=q.a;
  }else{
   data.questions.push(q);
  }
 });

 s.questionIds=newQs.map(q=>q.id);
 s.questions=newQs;
 s.items=newQs;

 const validIds=newQs.map(q=>String(q.id));
 s.checkedIds=s.checkedIds.filter(id=>validIds.includes(String(id)));
 s.mustIds=s.mustIds.filter(id=>validIds.includes(String(id)));

 data.activeSetId=s.id;
 currentSetId=s.id;
 currentQuestion=null;
 currentBag=[];
 questionHistory=[];
 historyIndex=-1;
 currentRound=0;
 reviewMode=false;
 lastComment="";

 cancelEdit(false);
 saveData();
 render();
 alert(wasUpdating?"更新しました！":"保存しました！");
}

function cancelEdit(){
 isEditing=false;
 draft=[];
 editingId=null;
 document.getElementById("editor").classList.add("hidden");
 render();
}

function showManage(){
 document.getElementById("manage").classList.remove("hidden");
 document.getElementById("editor").classList.add("hidden");
 renderManage();
}

function hideManage(){
 document.getElementById("manage").classList.add("hidden");
}

function renderManage(){
 const el=document.getElementById("manageList");
 el.innerHTML="";
 data.sets.forEach(s=>{
  const box=document.createElement("div");
  box.className="questionitem";

  const name=document.createElement("strong");
  name.textContent=s.name+" ("+setQuestions(s).length+"問)";

  const row=document.createElement("div");
  row.className="row";

  const edit=document.createElement("button");
  edit.textContent="編集";
  edit.onclick=()=>editSet(s.id);

  const rename=document.createElement("button");
  rename.className="secondary";
  rename.textContent="名前変更";
  rename.onclick=()=>renameSet(s.id);

  const del=document.createElement("button");
  del.className="danger";
  del.textContent="削除";
  del.onclick=()=>deleteSet(s.id);

  row.append(edit,rename,del);
  box.append(name,row);
  el.appendChild(box);
 });
}

function renameSet(id){
 const pw=prompt("編集パスワードを入力してください");
 if(pw!=="Hibiki"){
  if(pw!==null)alert("パスワードが違います");
  return;
 }
 const s=getSet(id);
 if(!s)return;
 const n=prompt("新しいセット名",s.name);
 if(n&&n.trim()){
  s.name=n.trim();
  saveData();
  render();
  renderManage();
 }
}

function deleteSet(id){
 const pw=prompt("削除パスワードを入力してください");
 if(pw!=="Hibiki"){
  if(pw!==null)alert("パスワードが違います");
  return;
 }
 const s=getSet(id);
 if(!s)return;
 if(!confirm("「"+s.name+"」を削除しますか？"))return;

 data.sets=data.sets.filter(x=>String(x.id)!==String(id));
 if(String(currentSetId)===String(id)){
  currentSetId=null;
  currentQuestion=null;
  currentBag=[];
  currentRound=0;
 }
 saveData();
 render();
 renderManage();
}

function sharePayloadForSets(selectedIds){
 return {type:"QRM3",sets:data.sets.filter(s=>selectedIds.includes(String(s.id))).map(s=>({
  name:s.name,
  questions:setQuestions(s).map(q=>({q:q.q,a:q.a})),
  checkedQuestions:setQuestions(s).filter(q=>(s.checkedIds||[]).map(String).includes(String(q.id))).map(q=>({q:q.q,a:q.a})),
  mustQuestions:setQuestions(s).filter(q=>(s.mustIds||[]).map(String).includes(String(q.id))).map(q=>({q:q.q,a:q.a}))
 }))};
}
function renderShareSets(){
 const el=document.getElementById("shareSetList");
 if(!el)return;
 el.innerHTML="";
 if(!data.sets.length){el.innerHTML='<p class="muted">共有できるセットがまだありません。</p>';return;}
 data.sets.forEach(s=>{
  const label=document.createElement("label");
  label.style.cssText="display:flex;align-items:center;gap:10px;background:#f3f4ff;padding:10px;border-radius:10px;margin:7px 0;cursor:pointer";
  const cb=document.createElement("input");
  cb.type="checkbox";cb.className="shareSetCheck";cb.value=String(s.id);cb.style.cssText="width:22px;height:22px;flex:0 0 auto";
  const txt=document.createElement("span");txt.textContent=(s.name||"名前なし")+"（"+setQuestions(s).length+"問）";
  label.append(cb,txt);el.append(label);
 });
}
function selectAllShareSets(checked){document.querySelectorAll(".shareSetCheck").forEach(cb=>cb.checked=checked);}
function createShareLink(){
 const ids=[...document.querySelectorAll(".shareSetCheck:checked")].map(cb=>cb.value);
 if(!ids.length){alert("共有するセットを選んでください");return;}
 const payload=sharePayloadForSets(ids);
 const encoded=btoa(unescape(encodeURIComponent(JSON.stringify(payload))));
 const link=location.origin+location.pathname+"#QRM3SHARE="+encoded;
 document.getElementById("shareLink").value=link;
 alert("共有リンクを作りました！リンクを相手に送ってください。");
}
async function copyShareLink(){
 const el=document.getElementById("shareLink");
 if(!el.value){createShareLink();if(!el.value)return;}
 try{await navigator.clipboard.writeText(el.value);alert("共有リンクをコピーしました！");}
 catch(e){el.focus();el.select();document.execCommand("copy");alert("コピーしました（コピーできない場合は選択してコピーしてください）");}
}
function importPayloadSets(obj,notify=true){
 const sets=obj.sets||[];
 if(!Array.isArray(sets))throw new Error("sets is not an array");
 let added=0;
 sets.forEach(s=>{
  const qs=s.questions||s.items||[];
  const newSet={id:uid(),name:s.name||"読み込みセット",questionIds:[],questions:[],checkedIds:[],mustIds:[]};
  qs.forEach(q=>{
   const nq={id:uid(),q:q.q??q.question??"",a:q.a??q.answer??""};
   data.questions.push(nq);newSet.questionIds.push(nq.id);newSet.questions.push(nq);
  });
  (s.checkedQuestions||[]).forEach(c=>{const found=newSet.questions.find(q=>q.q===c.q&&q.a===c.a);if(found)newSet.checkedIds.push(String(found.id));});
  (s.mustQuestions||[]).forEach(c=>{const found=newSet.questions.find(q=>q.q===c.q&&q.a===c.a);if(found)newSet.mustIds.push(String(found.id));});
  data.sets.push(newSet);added++;
  currentSetId=newSet.id;
  data.activeSetId=newSet.id;
 });
 if(added){currentQuestion=null;answerShown=false;currentBag=[];questionHistory=[];historyIndex=-1;currentRound=0;reviewMode=false;lastComment="";saveData();render();}
 if(notify&&added)alert(added+"セット読み込みました！");
 return added;
}
function importShareFromUrl(){
 const hash=location.hash;
 if(!hash.startsWith("#QRM3SHARE="))return;
 try{
  const encoded=hash.slice("#QRM3SHARE=".length);
  const obj=JSON.parse(decodeURIComponent(escape(atob(encoded))));
  if(obj.type!=="QRM3"||!Array.isArray(obj.sets))throw new Error();
  importPayloadSets(obj,false);
  history.replaceState(null,"",location.pathname+location.search);
 }catch(e){alert("共有リンクが正しくないか、内容を読み込めませんでした。");}
}

function exportCode(){
 const payload={
  type:"QRM3",
  sets:data.sets.map(s=>({
   name:s.name,
   questions:setQuestions(s).map(q=>({q:q.q,a:q.a})),
   checkedQuestions:setQuestions(s).filter(q=>(s.checkedIds||[]).includes(String(q.id))).map(q=>({q:q.q,a:q.a})),
   mustQuestions:setQuestions(s).filter(q=>(s.mustIds||[]).includes(String(q.id))).map(q=>({q:q.q,a:q.a}))
  }))
 };
 document.getElementById("transfer").value="QRM3-"+btoa(unescape(encodeURIComponent(JSON.stringify(payload))));
}

function copyCode(){
 const t=document.getElementById("transfer");
 if(!t.value)exportCode();
 t.select();
 document.execCommand("copy");
 alert("コピーしました");
}

function importCode(){
 const code=document.getElementById("transfer").value.trim();
 if(!code){alert("引き継ぎコードを入力してください");return}
 try{
  const raw=code.startsWith("QRM3-")?code.slice(5):code;
  const obj=JSON.parse(decodeURIComponent(escape(atob(raw))));
  importPayloadSets(obj,true);
 }catch(e){alert("コードが正しくありません");}
}

document.getElementById("questionInput").addEventListener("keydown",e=>{
 if(e.key==="Enter"&&!e.shiftKey){
  e.preventDefault();
  document.getElementById("answerInput").focus();
 }
});

document.getElementById("answerInput").addEventListener("keydown",e=>{
 if(e.key==="Enter"&&!e.shiftKey){
  e.preventDefault();
  addQuestion();
 }
});

document.addEventListener("keydown",e=>{
 if(e.target.matches("input,textarea"))return;
 if(e.key==="ArrowRight"){
  e.preventDefault();
  nextQuestion();
 }
 if(e.key==="ArrowLeft"){
  e.preventDefault();
  previousQuestion();
 }
 if(e.key==="Enter"){
  e.preventDefault();
  if(!currentQuestion)nextQuestion();
  else if(!answerShown)toggleAnswer();
  else nextQuestion();
 }
});

loadData();
if(data.activeSetId&&getSet(data.activeSetId))currentSetId=data.activeSetId;
render();
importShareFromUrl();
</script>
</body>
</html>
