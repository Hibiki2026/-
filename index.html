
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>問題ランダム機構</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(135deg,#f1f3ff,#fff2fa,#effaff);font-family:system-ui,sans-serif;color:#28294b}
header{text-align:center;padding:24px 12px}
.logo{display:inline-grid;place-items:center;width:58px;height:58px;border-radius:19px;background:linear-gradient(135deg,#7666f5,#b17aff);color:white;font-size:29px}
h1{margin:10px 0 5px;font-size:25px}
.sub{color:#888da8;font-size:13px}
main{max-width:850px;margin:auto;padding:0 13px 40px}
.card{background:white;border:1px solid #e8e9f5;border-radius:19px;padding:18px;margin-bottom:14px;box-shadow:0 5px 20px #34385c0b}
.tabs{display:flex;gap:8px;margin-bottom:14px}
.tab{flex:1;border:0;padding:12px;border-radius:13px;background:#fff;color:#727792;font-weight:800;cursor:pointer}
.tab.active{background:#6658e9;color:white}
.panel{display:none}.panel.active{display:block}
button{cursor:pointer;border:0;border-radius:12px;padding:12px 15px;font-weight:800;font-family:inherit}
button:active{transform:scale(.97)}
.primary{background:linear-gradient(135deg,#6858e9,#9383ff);color:white}
.secondary{background:#efefff;color:#6158cb}
.green{background:#e6fbf3;color:#16946c}
.pink{background:#fff0f7;color:#d94d88}
.gray{background:#f1f3f7;color:#67718a}
.red{background:#fff0ed;color:#d75b52}
.full{width:100%}
label{font-size:13px;font-weight:800;display:block;margin-bottom:6px}
input,textarea{width:100%;padding:12px;border:1px solid #e3e5f2;border-radius:12px;background:#fafbff;color:#29294a;font:inherit;outline:none}
input:focus,textarea:focus{border-color:#8b7cff}
textarea{resize:vertical;min-height:80px}
.field{margin-bottom:12px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1}
.stats{display:flex;gap:10px;margin-bottom:14px}
.stat{flex:1;text-align:center;padding:13px;background:white;border:1px solid #e8e9f5;border-radius:15px}
.num{font-size:24px;font-weight:900;color:#6858e9}
.small{font-size:12px;color:#888da8}
.question{min-height:205px;border-radius:18px;background:linear-gradient(135deg,#f2efff,#edfbff);display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:24px}
.q-label{font-size:12px;letter-spacing:2px;color:#8c80db;font-weight:900}
.q-text{font-size:clamp(21px,4vw,30px);font-weight:900;white-space:pre-wrap;overflow-wrap:anywhere;margin-top:16px}
.answer{display:none;margin-top:12px;padding:18px;text-align:center;border-radius:15px;background:#eafff5;border:1px solid #d5f6e8}
.a-label{font-size:12px;color:#229c76;font-weight:900}
.a-text{font-size:21px;font-weight:900;white-space:pre-wrap;overflow-wrap:anywhere;margin-top:8px}
.list{display:grid;gap:9px}
.item{display:flex;gap:9px;align-items:center;border:1px solid #e8e9f5;padding:12px;border-radius:13px}
.item-body{flex:1;min-width:0;overflow-wrap:anywhere}
.item-q{font-weight:800}
.item-a{font-size:13px;color:#858aa3;margin-top:4px}
.item-buttons{display:flex;gap:5px}
.item-buttons button{padding:8px 10px;font-size:12px}
.empty{text-align:center;padding:24px;color:#9398ad}
.set-item{display:flex;align-items:center;gap:8px;padding:10px;border:1px solid #e7e8f4;border-radius:12px;margin-bottom:8px}
.set-name{font-weight:800;flex:1;overflow-wrap:anywhere}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#29294a;color:white;padding:12px 18px;border-radius:12px;opacity:0;transition:.2s;z-index:10;text-align:center}
.toast.show{opacity:1}
hr{border:0;border-top:1px solid #eee;margin:20px 0}
@media(max-width:520px){.card{padding:14px}.item{align-items:flex-start}.item-buttons{flex-direction:column}.tabs{gap:4px}.tab{padding:10px 4px;font-size:12px}}
</style>
</head>
<body>
<header>
<div class="logo">🎲</div>
<h1>問題ランダム機構</h1>
<div class="sub">登録した問題をランダムに解こう！</div>
</header>
<main>

<div class="stats">
<div class="stat"><div class="num" id="total">0</div><div class="small">登録問題数</div></div>
<div class="stat"><div class="num" id="round">0</div><div class="small">周回数</div></div>
</div>

<div class="card">
<label>現在の問題セット</label>
<div id="currentSetName" style="font-weight:900;margin:5px 0 12px">未保存の問題セット</div>
<div class="row">
<button class="secondary" onclick="newSet()">＋ 新しいセット</button>
<button class="green" onclick="saveSet()">💾 保存</button>
</div>

<div class="tabs">
<button class="tab active" onclick="tab('quiz',this)">🎲 出題</button>
<button class="tab" onclick="tab('manage',this)">📝 問題管理</button>
<button class="tab" onclick="tab('sets',this)">📚 セット</button>
<button class="tab" onclick="tab('transfer',this)">📦 引継ぎ</button>
</div>

<section class="panel active" id="quiz">
<div class="card">
<div class="question">
<div class="q-label">RANDOM QUESTION</div>
<div class="q-text" id="qText">問題を追加してください</div>
</div>
<div class="answer" id="answer">
<div class="a-label">ANSWER</div>
<div class="a-text" id="aText"></div>
</div>
<div class="row" style="margin-top:12px">
<button class="green" onclick="toggleAnswer()">👀 答えを見る</button>
<button class="primary" onclick="next()">🎲 次の問題</button>
</div>
<div class="row" style="margin-top:10px">
<button class="pink full" onclick="resetRound()">↩ 元通りにする</button>
</div>
<p class="small" style="text-align:center;margin-bottom:0">1周するまで全問1回ずつ出題。全問終了すると自動で次の周になります。</p>
</div>
</section>

<section class="panel" id="manage">
<div class="card">
<div class="field">
<label>問題文</label>
<textarea id="qInput" placeholder="問題を入力（Enterで答え欄へ）"></textarea>
</div>
<div class="field">
<label>答え</label>
<textarea id="aInput" placeholder="答えを入力（Enterで登録・Shift+Enterで改行）"></textarea>
</div>
<div class="row">
<button class="primary" onclick="addQuestion()">＋ 問題を追加</button>
<button class="gray" onclick="clearInput()">クリア</button>
</div>
</div>
<div class="card">
<div style="font-weight:900;margin-bottom:12px">登録した問題</div>
<div class="list" id="list"></div>
</div>
</section>

<section class="panel" id="sets">
<div class="card">
<div style="font-weight:900;margin-bottom:12px">📚 保存した問題セット</div>
<div class="list" id="setsList"></div>
</div>
<div class="card">
<div class="field">
<label>セットのタイトル</label>
<input id="setTitle" placeholder="例：英単語テスト、歴史の問題">
</div>
<button class="primary full" onclick="saveSet()">このタイトルで保存</button>
</div>
</section>

<section class="panel" id="transfer">
<div class="card">
<div style="font-weight:900;margin-bottom:10px">📤 引き継ぎコード作成</div>
<button class="primary full" onclick="exportCode()">コードを作る</button>
<textarea id="export" style="margin-top:10px" placeholder="コードがここに表示されます"></textarea>
<button class="secondary full" style="margin-top:8px" onclick="copyCode()">📋 コピー</button>
<hr>
<div style="font-weight:900;margin-bottom:10px">📥 コードを読み込む</div>
<textarea id="import" placeholder="コードを貼り付け"></textarea>
<div class="row" style="margin-top:8px">
<button class="secondary" onclick="pasteCode()">📋 貼り付け</button>
<button class="green" onclick="importCode()">追加読み込み</button>
</div>
<button class="red full" style="margin-top:8px" onclick="replaceCode()">全部置き換える</button>
</div>
</section>
</main>
<div class="toast" id="toast"></div>

<script>
const KEY="question_random_mechanism_v2";
let questions=[];
let sets=[];
let activeSetId=null;
let current=null;
let bag=[];
let rounds=0;
let editing=null;
let answerVisible=false;

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2)}
function toast(s){
 let t=document.getElementById("toast");t.textContent=s;t.classList.add("show");
 clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.classList.remove("show"),2200)
}
function load(){
 try{
  let d=JSON.parse(localStorage.getItem(KEY)||"{}");
  questions=d.questions||[];sets=d.sets||[];
  activeSetId=d.activeSetId||null;
  rounds=d.rounds||0;bag=d.bag||[];
 }catch(e){}
 update();render();renderSets();setSetName();
}
function persist(){
 localStorage.setItem(KEY,JSON.stringify({questions,sets,activeSetId,rounds,bag}));
 update();render();renderSets();setSetName();
}
function update(){
 document.getElementById("total").textContent=questions.length;
 document.getElementById("round").textContent=rounds;
}
function setSetName(){
 let s=sets.find(x=>x.id===activeSetId);
 document.getElementById("currentSetName").textContent=s?s.title:"未保存の問題セット";
}
function tab(id,btn){
 document.querySelectorAll(".panel").forEach(x=>x.classList.remove("active"));
 document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
 document.getElementById(id).classList.add("active");btn.classList.add("active");
 if(id==="manage")render();
 if(id==="sets")renderSets();
}
function addQuestion(){
 let q=document.getElementById("qInput").value.trim();
 let a=document.getElementById("aInput").value.trim();
 if(!q||!a){toast("問題文と答えを両方入力してね");return}
 if(editing){
  let x=questions.find(z=>z.id===editing);if(x){x.q=q;x.a=a}
  editing=null;toast("編集しました");
 }else{
  questions.push({id:uid(),q,a});toast("問題を追加しました！");
 }
 clearInput();bag=[];current=null;hideAnswer();persist();
}
function clearInput(){
 document.getElementById("qInput").value="";
 document.getElementById("aInput").value="";
 editing=null;
}
function render(){
 let el=document.getElementById("list");
 if(!questions.length){el.innerHTML='<div class="empty">問題はまだありません</div>';return}
 el.innerHTML=questions.map((x,i)=>`<div class="item">
 <div class="item-body"><div class="item-q">${i+1}. ${esc(x.q)}</div><div class="item-a">答え：${esc(x.a)}</div></div>
 <div class="item-buttons"><button class="secondary" onclick="edit('${x.id}')">編集</button><button class="red" onclick="del('${x.id}')">削除</button></div></div>`).join("")
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function edit(id){
 let x=questions.find(z=>z.id===id);if(!x)return;
 editing=id;document.getElementById("qInput").value=x.q;document.getElementById("aInput").value=x.a;
 document.getElementById("qInput").focus();window.scrollTo({top:0,behavior:"smooth"})
}
function del(id){
 if(!confirm("この問題を削除しますか？"))return;
 questions=questions.filter(x=>x.id!==id);bag=[];current=null;hideAnswer();persist();toast("削除しました")
}
function shuffle(a){
 for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}
 return a
}
function next(){
 if(!questions.length){toast("先に問題を追加してね");return}
 if(!bag.length){
  bag=shuffle(questions.map(x=>x.id));
  rounds++;
 }
 let id=bag.pop();
 if(questions.length>1&&id===current?.id&&bag.length){
  let swap=bag[bag.length-1];bag[bag.length-1]=id;id=swap;
 }
 current=questions.find(x=>x.id===id)||questions[0];
 document.getElementById("qText").textContent=current.q;
 document.getElementById("aText").textContent=current.a;
 hideAnswer();persist();
}
function toggleAnswer(){
 if(!current){if(questions.length){next()}else{toast("問題を追加してね");return}}
 answerVisible=!answerVisible;
 document.getElementById("answer").style.display=answerVisible?"block":"none";
}
function hideAnswer(){answerVisible=false;document.getElementById("answer").style.display="none"}
function resetRound(){
 bag=[];rounds=0;current=null;hideAnswer();
 document.getElementById("qText").textContent="問題を追加してください";
 document.getElementById("aText").textContent="";
 persist();toast("周回をリセットしました")
}
function newSet(){
 if(!confirm("新しい問題セットを作りますか？現在の問題は保存されていない場合、セットに保存されません。"))return;
 questions=[];activeSetId=null;rounds=0;bag=[];current=null;hideAnswer();
 document.getElementById("qText").textContent="問題を追加してください";
 document.getElementById("setTitle").value="";
 persist();toast("新しいセットを作りました")
}
function saveSet(){
 let title=document.getElementById("setTitle").value.trim();
 if(!title){
  title=prompt("保存する問題セットのタイトルを入力してください");
  if(!title)return;
  document.getElementById("setTitle").value=title;
 }
 let existing=sets.find(x=>x.id===activeSetId);
 if(existing){existing.title=title;existing.questions=JSON.parse(JSON.stringify(questions))}
 else{
  let s={id:uid(),title,questions:JSON.parse(JSON.stringify(questions))};
  sets.push(s);activeSetId=s.id;
 }
 persist();toast("「"+title+"」を保存しました！");
}
function renderSets(){
 let el=document.getElementById("setsList");
 if(!sets.length){el.innerHTML='<div class="empty">保存したセットはありません</div>';return}
 el.innerHTML=sets.map(s=>`<div class="set-item">
 <div class="set-name">${esc(s.title)}<div class="small">${s.questions.length}問</div></div>
 <button class="green" onclick="loadSet('${s.id}')">開く</button>
 <button class="secondary" onclick="renameSet('${s.id}')">名前</button>
 <button class="red" onclick="deleteSet('${s.id}')">削除</button>
 </div>`).join("")
}
function loadSet(id){
 let s=sets.find(x=>x.id===id);if(!s)return;
 if(!confirm("「"+s.title+"」を読み込みますか？現在の問題セットは置き換わります。"))return;
 questions=JSON.parse(JSON.stringify(s.questions));activeSetId=id;bag=[];rounds=0;current=null;hideAnswer();
 document.getElementById("qText").textContent="問題を追加してください";
 persist();toast("セットを読み込みました")
}
function renameSet(id){
 let s=sets.find(x=>x.id===id);if(!s)return;
 let n=prompt("新しいタイトル",s.title);if(n&&n.trim()){s.title=n.trim();persist()}
}
function deleteSet(id){
 if(!confirm("この保存セットを削除しますか？"))return;
 sets=sets.filter(x=>x.id!==id);if(activeSetId===id)activeSetId=null;persist();toast("削除しました")
}
function exportCode(){
 let data={questions,sets,activeSetId,rounds,bag};
 document.getElementById("export").value="QRM2-"+btoa(unescape(encodeURIComponent(JSON.stringify(data))));
 toast("引き継ぎコードを作成しました")
}
async function copyCode(){
 let x=document.getElementById("export").value;if(!x){toast("先にコードを作ってね");return}
 try{await navigator.clipboard.writeText(x);toast("コピーしました！")}
 catch(e){document.getElementById("export").select();document.execCommand("copy");toast("コピーしました")}
}
async function pasteCode(){
 try{let t=await navigator.clipboard.readText();document.getElementById("import").value=t;toast("貼り付けました")}
 catch(e){toast("貼り付けできません。入力欄を長押しして貼り付けてね")}
}
function decode(){
 let c=document.getElementById("import").value.trim();
 if(!c.startsWith("QRM2-"))throw 0;
 return JSON.parse(decodeURIComponent(escape(atob(c.slice(5)))))
}
function importCode(){
 try{
  let d=decode();
  questions.push(...(d.questions||[]).map(x=>({id:uid(),q:x.q,a:x.a})));
  sets.push(...(d.sets||[]));persist();toast("追加読み込み完了")
 }catch(e){toast("コードが正しくありません")}
}
function replaceCode(){
 if(!confirm("現在のデータをコードの内容に置き換えますか？"))return;
 try{
  let d=decode();questions=d.questions||[];sets=d.sets||[];
  activeSetId=d.activeSetId||null;rounds=d.rounds||0;bag=d.bag||[];
  current=null;hideAnswer();persist();toast("置き換え完了")
 }catch(e){toast("コードが正しくありません")}
}
document.getElementById("qInput").addEventListener("keydown",e=>{
 if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();document.getElementById("aInput").focus()}
});
document.getElementById("aInput").addEventListener("keydown",e=>{
 if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();addQuestion()}
});
load();
</script>
</body>
</html>
